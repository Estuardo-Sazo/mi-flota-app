<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mi Flota</title>
    <base href="./" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Registra ingresos y gastos de tus vehículos, incluso sin conexión." />
    <!-- Aplica el tema guardado antes de pintar para evitar parpadeos (oscuro por defecto) -->
    <script>
      try {
        var t = localStorage.getItem('mi-flota-theme');
        if (t === 'light' || t === 'dark') document.documentElement.classList.add(t);
      } catch (e) {}
    </script>
    <style>
      /* Fuente >=16px en inputs para que iOS no haga zoom al enfocar */
      html {
        font-size: 16px;
        background: #0c1014;
      }
      input,
      textarea,
      select {
        font-size: 1rem;
      }
    </style>
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mi Flota" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0c1014" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/ios/152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/ios/180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icons/ios/192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icons/ios/512.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
