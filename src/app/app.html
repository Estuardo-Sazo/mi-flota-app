<div class="app-shell">
  <!-- Aviso de nueva versión (PWA) -->
  @if (updateAvailable()) {
    <div class="fixed left-0 right-0 z-50 px-4 animate-fade-in-fast" style="top: calc(env(safe-area-inset-top, 0px) + 64px)">
      <div class="mx-auto max-w-md card flex items-center gap-3 !py-3" style="background: var(--color-surface-raised); border-color: var(--color-border-strong); box-shadow: var(--shadow-lg)">
        <div class="min-w-0 flex-1">
          <p class="text-sm font-semibold" style="color: var(--color-text)">Nueva versión disponible</p>
          <p class="caption">Actualiza para obtener mejoras.</p>
        </div>
        <button type="button" (click)="reloadApp()" class="btn btn-primary btn-sm">Actualizar</button>
        <button type="button" (click)="dismissUpdate()" class="icon-btn" aria-label="Cerrar aviso">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  }

  <!-- Encabezado -->
  <header class="app-header fixed top-0 left-0 right-0 z-20">
    <div class="app-header-inner max-w-md mx-auto px-5">
      <h1 class="title-lg">{{ viewTitle() }}</h1>
      <div class="flex items-center gap-1">
        <app-sync-badge></app-sync-badge>
        <button
          type="button"
          (click)="toggleTheme()"
          class="icon-btn"
          [attr.aria-label]="isDarkActive() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        >
          @if (isDarkActive()) {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>
      </div>
    </div>
  </header>

  <main class="main-content flex-grow overflow-y-auto fade-in">
    <div class="max-w-md mx-auto px-4 py-3 space-y-5">
      <router-outlet></router-outlet>
    </div>
  </main>

  <!-- Navegación inferior -->
  <div class="bottom-nav-wrapper">
    <nav class="bottom-nav" aria-label="Navegación principal">
      <a routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-pill">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>
        </span>
        <span>Resumen</span>
      </a>
      <a routerLink="/vehiculos" routerLinkActive="active">
        <span class="nav-pill">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 16V9a1 1 0 011-1h9l4 4h1a1 1 0 011 1v3M4 16h1m14 0h-1M4 16a2 2 0 104 0m0 0h6m0 0a2 2 0 104 0"/></svg>
        </span>
        <span>Flota</span>
      </a>
      <a routerLink="/registros" routerLinkActive="active">
        <span class="nav-pill">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        </span>
        <span>Registros</span>
      </a>
      <a routerLink="/reportes" routerLinkActive="active">
        <span class="nav-pill">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M5 20V10m7 10V4m7 16v-7"/></svg>
        </span>
        <span>Reportes</span>
      </a>
      <a routerLink="/ajustes" routerLinkActive="active">
        <span class="nav-pill">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        </span>
        <span>Ajustes</span>
      </a>
    </nav>
  </div>

  <app-toast-container></app-toast-container>
</div>
