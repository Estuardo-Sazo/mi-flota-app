<div class="modal-overlay" (click)="cancel.emit()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <h2 class="text-lg font-semibold mb-2" style="color: var(--color-text)">{{ title }}</h2>
    <p class="text-sm text-secondary mb-6">{{ message }}</p>
    <div class="flex justify-end gap-2">
      <button (click)="cancel.emit()" class="btn btn-outline text-xs px-3 py-2">{{ cancelText }}</button>
      <button (click)="confirm.emit()" class="btn btn-danger text-xs px-3 py-2">{{ confirmText }}</button>
    </div>
  </div>
</div>
