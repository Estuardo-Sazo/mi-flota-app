<div class="modal-overlay" (click)="cancel.emit()">
  <div class="modal-panel" (click)="$event.stopPropagation()" role="alertdialog" aria-modal="true" [attr.aria-label]="title">
    <h2 class="text-lg font-semibold tracking-tight mb-2" style="color: var(--color-text)">{{ title }}</h2>
    <p class="text-sm text-secondary mb-6" style="line-height: 1.5">{{ message }}</p>
    <div class="grid grid-cols-2 gap-3">
      <button type="button" (click)="cancel.emit()" class="btn btn-outline">{{ cancelText }}</button>
      <button type="button" (click)="confirm.emit()" class="btn btn-danger">{{ confirmText }}</button>
    </div>
  </div>
</div>
