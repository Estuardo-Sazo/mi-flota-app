<div class="modal-overlay" (click)="onClose()">
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <h2 class="text-lg font-bold mb-4" style="color: var(--color-text)">
      Añadir {{ type === 'income' ? 'Ingreso' : 'Gasto' }}
      @if (vehicleAlias) {
        <span class="text-sm font-normal text-secondary">para {{ vehicleAlias }}</span>
      }
    </h2>

    <form (ngSubmit)="onSave()" class="space-y-4">
      <div>
        <label for="amount" class="block text-sm font-medium text-secondary mb-1">Monto</label>
        <input
          type="number"
          id="amount"
          name="amount"
          [(ngModel)]="amount"
          required
          inputmode="decimal"
          pattern="[0-9]*"
          step="0.01"
          min="0"
        />
      </div>

      <div>
        <label for="description" class="block text-sm font-medium text-secondary mb-1">Descripción</label>
        <input
          type="text"
          id="description"
          name="description"
          [(ngModel)]="description"
          required
        />
      </div>

      <div>
        <label for="date" class="block text-sm font-medium text-secondary mb-1">Fecha</label>
        <input
          type="datetime-local"
          id="date"
          name="date"
          [(ngModel)]="date"
          required
        />
      </div>

      <div class="flex justify-end space-x-2 pt-4">
        <button type="button" (click)="onClose()" class="btn btn-outline">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="!amount() || !description()">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
