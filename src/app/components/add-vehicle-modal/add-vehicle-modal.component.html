<div class="sheet-overlay" (click)="onClose()">
  <div class="sheet" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" [attr.aria-label]="vehicle ? 'Editar vehículo' : 'Añadir vehículo'">
    <div class="sheet-handle"></div>

    <div class="mb-5">
      <h2 class="text-xl font-semibold tracking-tight" style="color: var(--color-text)">
        {{ vehicle ? 'Editar vehículo' : 'Nuevo vehículo' }}
      </h2>
      <p class="caption mt-1">Un nombre corto te ayuda a reconocerlo al registrar movimientos.</p>
    </div>

    <form (ngSubmit)="onPrimaryAction()" class="space-y-4">
      <div>
        <label for="alias" class="field-label">Nombre o alias</label>
        <input type="text" id="alias" name="alias" [(ngModel)]="alias" required placeholder="Ej. Tuk tuk" autocomplete="off">
      </div>
      <div>
        <label for="placa" class="field-label">Placa</label>
        <input type="text" id="placa" name="placa" [(ngModel)]="placa" required placeholder="Ej. M123ABC" autocomplete="off" autocapitalize="characters">
      </div>

      <div class="grid gap-3 pt-2" style="grid-template-columns: auto 1fr">
        <button type="button" (click)="onClose()" class="btn btn-outline">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="!alias().trim() || !placa().trim()">{{ vehicle ? 'Guardar cambios' : 'Agregar vehículo' }}</button>
      </div>
    </form>
  </div>
</div>
